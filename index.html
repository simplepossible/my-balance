<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>My Balance Sheet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <p class="eyebrow" id="top-eyebrow">Balance sheet</p>
        <h1 id="screen-title">Net</h1>
      </header>

      <main id="screen" class="screen"></main>

      <nav class="tabbar" aria-label="Main">
        <button class="tab" data-tab="income" type="button">
          <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
          </svg>
          Inflows
        </button>
        <button class="tab tab-center is-active" data-tab="finance" type="button">
          <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.4" />
            <circle cx="12" cy="12" r="2.4" fill="currentColor" />
          </svg>
          Net
        </button>
        <button class="tab" data-tab="expenses" type="button">
          <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
          </svg>
          Outflows
        </button>
      </nav>
    </div>

    <script src="app.js"></script>
  </body>
</html>
